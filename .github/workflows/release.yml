name: release

on:
  push:
    tags: ["v*"]

jobs:
  pypi:
    name: publish repoglass to PyPI
    runs-on: ubuntu-latest
    permissions:
      # Trusted publishing: PyPI verifies this workflow's OIDC identity, so no
      # API token exists to leak or rotate. Configured on pypi.org, not here.
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: install
        run: python -m pip install --quiet .

      - name: tests
        env:
          HF_HUB_OFFLINE: "1"
        run: python -m unittest discover -s tests -t .

      - name: build
        run: |
          python -m pip install --quiet build
          python -m build

      - name: the version built must be the tag pushed
        run: |
          tag="${GITHUB_REF_NAME#v}"
          built=$(ls dist/repoglass-*.tar.gz | sed 's|.*/repoglass-\(.*\)\.tar\.gz|\1|')
          test "$tag" = "$built" || {
            echo "tag $tag but built $built -- bump __version__" >&2
            exit 1
          }

      - uses: pypa/gh-action-pypi-publish@release/v1
