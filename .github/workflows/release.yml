name: release

on:
  push:
    tags: ["v*"]
  # Points the formula at a tag already released, so the tap side can be
  # exercised without spending a PyPI version on finding out.
  workflow_dispatch:
    inputs:
      tag:
        description: an existing tag, e.g. v0.1.0
        required: true

jobs:
  pypi:
    name: publish repoglass to PyPI
    # A hand-run must never publish: the tag it names is already out.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      # Trusted publishing: PyPI verifies this workflow's OIDC identity, so no
      # API token exists to leak or rotate. Configured on pypi.org, not here.
      id-token: write
      contents: write        # the release this tag becomes

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: install
        run: python -m pip install --quiet .

      - name: tests
        env:
          HF_HUB_OFFLINE: "1"
        run: python -m unittest discover -s tests -t .

      - name: build
        run: |
          python -m pip install --quiet build
          python -m build

      - name: the version built must be the tag pushed
        run: |
          tag="${GITHUB_REF_NAME#v}"
          built=$(ls dist/repoglass-*.tar.gz | sed 's|.*/repoglass-\(.*\)\.tar\.gz|\1|')
          test "$tag" = "$built" || {
            echo "tag $tag but built $built -- bump __version__" >&2
            exit 1
          }

      - uses: pypa/gh-action-pypi-publish@release/v1

      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/* --generate-notes --title "$TAG"

  brew:
    name: point the tap at the new release
    needs: pypi
    # `needs` alone would skip this when pypi is skipped, which is every
    # hand-run.
    if: always() && (needs.pypi.result == 'success'
        || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest

    steps:
      # The tap is a second repository, which GITHUB_TOKEN is not scoped
      # to. HOMEBREW_TAP_TOKEN is a PAT holding contents:write on it.
      - uses: actions/checkout@v4
        with:
          repository: nitkrar/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: point the formula at this sdist
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version="${TAG#v}"
          python3 - "$version" <<'PY'
          import re, sys, time, urllib.request

          version = sys.argv[1]
          # The simple index, not the JSON API: the JSON one lags minutes
          # behind an upload, and this job runs seconds after. It also
          # carries the digest, so there is nothing to download and hash.
          want = re.compile(
              rf'(https://[^"#]*repoglass-{re.escape(version)}\.tar\.gz)'
              r'#sha256=([0-9a-f]{64})'
          )
          for attempt in range(10):
              index = urllib.request.urlopen(
                  "https://pypi.org/simple/repoglass/"
              ).read().decode()
              found = want.search(index)
              if found:
                  break
              time.sleep(6)
          else:
              sys.exit(f"{version} is not on the index after 60s")
          url, sha = found.group(1), found.group(2)

          path = "Formula/repoglass.rb"
          src = open(path).read()
          # Resources are other distributions, so the one file named
          # repoglass-*.tar.gz is this formula's own source. Anchoring on
          # it keeps the 42 resource sha256 lines out of reach.
          pat = re.compile(
              r'(  url "https://files\.pythonhosted\.org/[^"]*/'
              r'repoglass-[0-9][^"]*\.tar\.gz"\n  sha256 ")[0-9a-f]{64}(")'
          )
          if len(pat.findall(src)) != 1:
              sys.exit(f"found {len(pat.findall(src))} release blocks, want 1")

          out = pat.sub(f'  url "{url}"\n  sha256 "{sha}"', src, count=1)
          if out == src:
              print("already at this release")
              raise SystemExit(0)

          moved = sum(1 for a, b in zip(src.splitlines(), out.splitlines()) if a != b)
          if moved != 2:
              sys.exit(f"refusing to write: {moved} lines differ, want 2")

          open(path, "w").write(out)
          print(f"formula -> {version}")
          PY

      - name: commit, once the diff is only the release
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if git diff --quiet; then
            echo "formula already at ${TAG}, nothing to push"
            exit 0
          fi
          # Resources pin the dependency tree, not repoglass, so a release
          # leaves them alone. Anything else here is a bug in the rewrite,
          # and pushing it would break `brew install`.
          git diff --stat
          expected="$(printf '2\t2\tFormula/repoglass.rb')"
          test "$(git diff --numstat)" = "$expected"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Update repoglass to ${TAG#v}"
          git push
