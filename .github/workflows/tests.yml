name: tests

on:
  push:
    branches: [trunk]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # 3.11 is the floor in pyproject, and the only place it is exercised.
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    env:
      # tests/test_embeddings.py states that no test may reach the network.
      # Setting this makes a violation fail here rather than pass locally off
      # a warm cache.
      HF_HUB_OFFLINE: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Every dependency ships an abi3 wheel, so this resolves without a
      # compiler on any runner in the matrix.
      - name: install
        run: python -m pip install --quiet .

      - name: tests
        run: python -m unittest discover -s tests -t .

      - name: run what was installed
        run: |
          rpg --version
          repoglass --help

  # OnnxEmbedder asserts that two unrelated texts separate under a query,
  # which needs a real transformer and so cannot run in the offline matrix
  # above. Without this job those four tests skip everywhere and the
  # backend ships untested.
  onnx:
    name: onnx backend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-bge-small-en-v1.5

      - name: install
        run: python -m pip install --quiet '.[onnx]'

      # The tests construct the embedder with local_only, so they never
      # fetch anything themselves. Warming the cache through the same
      # constructor keeps the set of files it needs in one place.
      - name: fetch the model
        run: |
          python -c "
          from repoglass.embeddings.backends import OnnxEmbedder
          from tests.test_embed_backends import OnnxEmbedderTests as t
          OnnxEmbedder(t.MODEL, providers=t.PROVIDERS)
          "

      - name: tests
        run: |
          python -m unittest -v tests.test_embed_backends.OnnxEmbedderTests \
            2>&1 | tee out.txt
          # unittest exits 0 on a skip, so the one failure this job is meant
          # to catch is the tests not running at all.
          if grep -q skipped out.txt; then
            echo "::error::onnx tests skipped; this job exists to run them"
            exit 1
          fi
