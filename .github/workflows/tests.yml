name: tests

on:
  push:
    branches: [trunk]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # 3.11 is the floor in pyproject, and the only place it is exercised.
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    env:
      # tests/test_embeddings.py states that no test may reach the network.
      # Setting this makes a violation fail here rather than pass locally off
      # a warm cache.
      HF_HUB_OFFLINE: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Every dependency ships an abi3 wheel, so this resolves without a
      # compiler on any runner in the matrix.
      - name: install
        run: python -m pip install --quiet .

      - name: tests
        run: python -m unittest discover -s tests -t .

      - name: run what was installed
        run: |
          rpg --version
          repoglass --help
